name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint changed application files
        run: >-
          bunx eslint
          src/components/AdminOperationalPanel.tsx
          src/components/ProductUnavailable.tsx
          src/config/availability.ts
          src/integrations/supabase/types.ts
          src/lib/operational-availability.tsx
          src/lib/operational-types.ts
          src/lib/operational.functions.ts
          src/lib/orders.functions.ts
          src/routes/__root.tsx
          src/routes/acai.tsx
          src/routes/dia-dos-pais.tsx
          src/routes/index.tsx
          src/routes/mini-salada.tsx
          src/routes/monte.tsx
          src/routes/prontos.tsx
          --quiet
          --rule 'prettier/prettier: off'

      - name: Build
        run: bun run build
